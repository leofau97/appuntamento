<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un appuntamento per te</title>
<style>
:root{--bg1:#fdf2f8;--bg2:#e9d5f2;--card:#ffffffd9;--ink:#5a1230;--soft:#8a5a70;--pink:#d6246e;--chip:#f6e9ef;--line:#e7c9d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e0f18;--bg2:#2a1432;--card:#2b1823d9;--ink:#ffe3ee;--soft:#d9a9be;--pink:#f0508f;--chip:#3b2230;--line:#5a3347;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1e0f18;--bg2:#2a1432;--card:#2b1823d9;--ink:#ffe3ee;--soft:#d9a9be;--pink:#f0508f;--chip:#3b2230;--line:#5a3347;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
header{width:100%;max-width:440px;margin-bottom:14px}
.brand{font-weight:700;display:flex;justify-content:space-between;font-size:15px}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .4s}
.card{width:100%;max-width:440px;background:var(--card);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 10px 40px #d6246e22;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--pink);font-weight:700}
h1{font-size:30px;line-height:1.1;margin:14px 0 8px;letter-spacing:-.03em}
p.sub{color:var(--soft);font-size:14px;margin:0 0 22px}
.emo{font-size:44px}
.btn{border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 6px 18px #d6246e55;font-family:inherit}
.btn:disabled{opacity:.4;box-shadow:none}
.row{display:flex;gap:18px;justify-content:center;align-items:center;min-height:60px}
#no{background:var(--chip);color:var(--ink);box-shadow:none;z-index:9;touch-action:none;transition:left .18s,top .18s}
.hint{font-size:12px;color:var(--soft);margin-top:16px;min-height:16px}
label{display:block;text-align:left;font-size:12px;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:16px;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.opt{border:2px solid transparent;background:var(--chip);color:var(--ink);border-radius:16px;padding:16px 8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.opt.on{border-color:var(--pink);background:var(--card)}
.opt span{display:block;font-size:26px;margin-bottom:4px}
.paper{background:var(--chip);border-radius:18px;padding:18px;text-align:left;margin:14px 0 20px;font-size:15px;line-height:1.5}
.paper b{color:var(--pink)}
.paper hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
.foot{margin-top:16px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:700}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up 3s linear forwards;z-index:20}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<header><div class="brand"><span>❤ Per te</span><span id="n"></span></div><div class="bar"><i id="pb"></i></div></header>
<main class="card" id="c"></main>
<div class="foot">gli appuntamenti sbocciano meglio qui ❤</div>
<script>
const NOME="Amore"; // ← sostituisci con il suo nome
const OPZ=[["diner","🍔","American diner"],["pizza","🍕","Pizza"],["piadine","🫓","Piadine"],["grano","🌾","Grano Libero"],["cinema","🎬","Cinema"],["tacos","🌮","Tacos"]];
const DET={
diner:["Cosa ordiniamo?","Cheeseburger classico|Bacon burger|Hot dog|Milkshake e patatine"],
pizza:["Che pizza?","Margherita|Diavola|Prosciutto e funghi|Quattro formaggi"],
piadine:["Che piadina?","Crudo e squacquerone|Salsiccia e cipolla|Caprese|Nutella (dolce)"],
grano:["Cosa proviamo?","Pizza|Pasta|Un dolce|Sorpresa dal menu"],
cinema:["Che film vediamo?","Commedia romantica|Thriller|Animazione|Scegli tu, io ci sto"],
tacos:["Che tacos?","Pollo|Manzo|Vegetariani|Un po’ di tutto"]};
const S={d:"",t:"",o:null,x:null};let step=0;
const c=document.getElementById("c"),pb=document.getElementById("pb"),n=document.getElementById("n");
const hints=["psst… il NO è un po’ timido","dai, riprova 😏","non ce la farai mai","la risposta giusta c’è, ovviamente","ormai arrenditi 💕"];let tries=0;
function head(){n.textContent=(step+1)+" / 6";pb.style.width=((step+1)/6*100)+"%"}
function go(i){step=i;render()}
function render(){head();
if(step==0){c.innerHTML=`<div class="eyebrow">❤ Una domandina importante</div><h1>Usciresti a cena con me?</h1><p class="sub">Sii sincera. C’è una risposta giusta, ovviamente.</p><div class="row"><button class="btn" id="yes">SÌ ✨</button><button class="btn" id="no">NO</button></div><div class="hint" id="h">${hints[0]}</div>`;
yes.onclick=()=>go(1);setupNo()}
if(step==1){c.innerHTML=`<div class="emo">🎉</div><h1>ASPETTA, HAI DAVVERO DETTO SÌ??</h1><p class="sub">Ero prontissimo a un no 🥹</p><button class="btn" onclick="go(2)">ok, organizziamo →</button>`;burst(10)}
if(step==2){c.innerHTML=`<div class="eyebrow">Salviamo il momento</div><h1>Allora… quando sei libera?</h1><p class="sub">Scegli un giorno e un’ora che ti piacciono.</p><label>Data</label><input type="date" id="d" value="${S.d}"><label>Ora</label><input type="time" id="t" value="${S.t}"><br><br><button class="btn" id="nx" onclick="go(3)">avanti: cosa mangiamo →</button>`;
const chk=()=>{S.d=d.value;S.t=t.value;nx.disabled=!(S.d&&S.t)};d.min=new Date().toISOString().slice(0,10);d.oninput=t.oninput=chk;chk()}
if(step==3){c.innerHTML=`<div class="eyebrow">Ricerca per la serata</div><h1>Che ci va di fare? ✨</h1><p class="sub">Scegli il mood</p><div class="grid">${OPZ.map(o=>`<button class="opt ${S.o==o[0]?"on":""}" data-k="${o[0]}"><span>${o[1]}</span>${o[2]}</button>`).join("")}</div><button class="btn" id="nx" onclick="go(4)" ${S.o?"":"disabled"}>questo è il mood →</button>`;
c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.o!=b.dataset.k)S.x=null;S.o=b.dataset.k;render()})}
if(step==4){const [q,l]=DET[S.o];const em=OPZ.find(o=>o[0]==S.o)[1];c.innerHTML=`<div class="emo">${em}</div><h1>${q}</h1><p class="sub">Ultimo dettaglio, promesso.</p><div class="grid">${l.split("|").map(x=>`<button class="opt ${S.x==x?"on":""}">${x}</button>`).join("")}</div><button class="btn" id="nx" onclick="go(5)" ${S.x?"":"disabled"}>vediamo il riepilogo →</button>`;
c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.x=b.textContent;render()})}
if(step==5){const o=OPZ.find(o=>o[0]==S.o);const dt=new Date(S.d+"T00:00");const ds=dt.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
c.innerHTML=`<div class="eyebrow">❤ Il nostro appuntamento</div><h1>Ufficialmente fissato</h1><div class="paper">Per <b>${NOME}</b>,<hr>📅 <b>${ds}</b><br>🕐 alle <b>${S.t}</b><br>${o[1]} <b>${o[2]}</b> — ${S.x}<hr>Passo a prenderti io. Tu devi solo essere bellissima, ma tanto lo sei sempre. Il prezzo? Un sorriso, qualche risata e il tuo braccio sotto il mio. 💕</div><button class="btn" id="ok">Confermo con tutto il cuore ❤</button>`;
ok.onclick=()=>{burst(40);c.querySelector(".paper").innerHTML+="<hr><b>Confermato.</b> Non vedo l’ora. Ti amo. ❤";ok.remove()}}
}
function setupNo(){const no=document.getElementById("no"),yes=document.getElementById("yes");
function flee(px,py){tries++;document.getElementById("h").textContent=hints[Math.min(tries,hints.length-1)];
const w=no.offsetWidth,h=no.offsetHeight,yr=yes.getBoundingClientRect();let x,y;
for(let i=0;i<40;i++){x=10+Math.random()*(innerWidth-w-20);y=90+Math.random()*(innerHeight-h-110);
const far=Math.hypot(x+w/2-px,y+h/2-py)>160;const ov=x<yr.right+10&&x+w>yr.left-10&&y<yr.bottom+10&&y+h>yr.top-10;if(far&&!ov)break}
no.style.position="fixed";no.style.left=x+"px";no.style.top=y+"px"}
const stop=e=>{e.preventDefault();e.stopPropagation();const p=e.touches?e.touches[0]:e;flee(p.clientX,p.clientY)};
["pointerenter","pointerdown","touchstart","mousedown","click"].forEach(ev=>no.addEventListener(ev,stop,{passive:false}));
document.addEventListener("pointermove",e=>{if(!document.getElementById("no"))return;const r=no.getBoundingClientRect();
if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<90)flee(e.clientX,e.clientY)})}
function burst(k){for(let i=0;i<k;i++){const e=document.createElement("div");e.className="heart";e.textContent=["❤","💖","💕","✨"][i%4];e.style.left=Math.random()*100+"vw";e.style.fontSize=(16+Math.random()*24)+"px";e.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
render();
</script>
</body>
</html>
